<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Quicktoto Driver</title>


    <!-- CSS -->
    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- HEADER -->
    <div class="header">

        <h1>

            🚖 Driver Dashboard

        </h1>



        <div class="dropdown">

            <button class="dropbtn">

                Welcome,

                {{ driver[3] }}

                ▼

            </button>

            <div class="dropdown-content">

                <a href="#">

                    Profile

                </a>

                <a href="#">

                    Ride History

                </a>

                <a href="/logout">

                    Logout

                </a>

            </div>

        </div>

    </div>




    <!-- DRIVER LAYOUT -->
    <div class="driver-layout">

        <!-- FULLSCREEN MAP -->
        <div id="driverMap"></div>




        <!-- DRIVER PANEL -->
        <div class="driver-panel">

            <h2>

                🚖 Driver Dashboard

            </h2>



            <p>

                <strong>Name:</strong>

                {{ driver[3] }}

            </p>



            <p>

                <strong>Toto ID:</strong>

                {{ driver[7] }}

            </p>



            <p>

                <strong>Available Seats:</strong>

                <span id="seatText">

                    {{ driver[9] }}

                </span>

            </p>



            <p id="availabilityText">

                Status: Offline

            </p>




            <!-- ONLINE BUTTON -->
            <button id="toggleBtn">

                🟢 Go Online

            </button>




            <hr>




            <!-- REQUEST AREA -->
            <div id="rideContainer">

                <h3>

                    🔴 You are offline

                </h3>

            </div>

        </div>

    </div>




    <!-- LEAFLET -->
    <link rel="stylesheet"

    href="https://unpkg.com/leaflet/dist/leaflet.css"/>




    <!-- ROUTING CSS -->
    <link rel="stylesheet"

    href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>




    <!-- LEAFLET JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>




    <!-- ROUTING JS -->
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.min.js"></script>




    <!-- DRIVER JS -->
    <script src="{{ url_for('static', filename='driver.js') }}"></script>

</body>

</html>
